<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>City Explorer</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="sidebar-header">
          <p class="eyebrow">KCDC 2026</p>

          <h1 id="app-title">City Explorer</h1>

          <p class="intro">
            Explore historic places and see how a map and ordinary web UI can
            share application state.
          </p>
        </header>

        <p id="status" class="status" aria-live="polite"></p>

        <ul
          id="place-list"
          class="place-list"
          aria-label="Historic places"
        ></ul>
      </aside>

      <main id="map" class="map" aria-label="Interactive map"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
